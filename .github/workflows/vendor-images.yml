name: Vendor Omnigent Image to GHCR

# Upstream publishes ghcr.io/omnigent-ai/omnigent-server. We do NOT build
# from upstream's deploy/docker/Dockerfile: the web UI bundle is gitignored
# in their repo, so a plain `docker build` fails outside their CI (their own
# Dockerfile.prebuilt exists for exactly this reason and just does
# `FROM ghcr.io/omnigent-ai/omnigent-server`). So we mirror the published
# image into our namespace and pin by digest — same reproducibility, no
# dependency on upstream keeping a tag alive.
#
# To bump: edit UPSTREAM_TAG below and push, or run this workflow manually
# with an upstream_tag input.

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 03:00 UTC (nightly)
  push:
    branches:
      - master
    paths:
      - '.github/workflows/vendor-images.yml'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream omnigent-server tag to vendor'
        required: false
        default: ''

env:
  UPSTREAM_TAG: latest

jobs:
  vendor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy manifest, tag with upstream digest
        id: vendor
        env:
          UPSTREAM_TAG_OVERRIDE: ${{ inputs.upstream_tag }}
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/omnigent-server-vendor
        run: |
          set -e
          TAG="${UPSTREAM_TAG_OVERRIDE:-$UPSTREAM_TAG}"
          UPSTREAM_IMAGE="ghcr.io/omnigent-ai/omnigent-server:${TAG}"

          # imagetools copies the manifest index as-is: upstream ships
          # linux/amd64 + linux/arm64, and a pull/tag/push round-trip would
          # flatten it to the runner's single arch and change the digest.
          DIGEST=$(docker buildx imagetools inspect "${UPSTREAM_IMAGE}" --format '{{.Manifest.Digest}}')
          SHORT_TAG="d-$(echo "$DIGEST" | sed 's/sha256://' | cut -c1-12)"

          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:latest" \
            --tag "${GHCR_IMAGE}:${SHORT_TAG}" \
            "${UPSTREAM_IMAGE}@${DIGEST}"

          echo "Vendored ${UPSTREAM_IMAGE} (${DIGEST}) -> ${GHCR_IMAGE}:{latest,${SHORT_TAG}}"
          echo "vendor_tag=${SHORT_TAG}" >> "$GITHUB_OUTPUT"

    outputs:
      vendor_tag: ${{ steps.vendor.outputs.vendor_tag }}

  redeploy:
    needs: vendor
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-branch
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild deploy branch pinned to vendored digest
        env:
          OMNIGENT_VENDOR_TAG: ${{ needs.vendor.outputs.vendor_tag }}
        run: bash .github/scripts/build-deploy-branch.sh

      - name: Check Portainer webhook secret
        id: webhook
        env:
          HOOK: ${{ secrets.PORTAINER_REDEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then echo "set=true" >> "$GITHUB_OUTPUT"; fi

      - name: Trigger Portainer Redeploy Webhook
        if: steps.webhook.outputs.set == 'true'
        uses: distributhor/workflow-webhook@2381f0e9c7b6bf061fb1405bd0804b8706116369 # v3.0.8
        with:
          webhook_url: ${{ secrets.PORTAINER_REDEPLOY_HOOK }}
          webhook_secret: "trigger"
