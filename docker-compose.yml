# Omnigent server + Postgres, behind Traefik + oauth2-proxy forward-auth.
#
# Adapted from upstream deploy/docker/docker-compose.yaml
# (github.com/omnigent-ai/omnigent). Differences from upstream:
#   - image comes from our GHCR vendor mirror, pinned to a digest tag on
#     the `deploy` branch (see .github/workflows/vendor-images.yml)
#   - no published ports; Traefik reaches omnigent over traefik_default
#   - no Caddy overlay; Traefik terminates TLS
#   - auth is header mode — identity comes from oauth2-proxy's
#     X-Forwarded-Email (see README security note)
#
# The `:latest` tag below is a placeholder. The deploy branch rewrites it
# to the vendored digest tag; Portainer watches `deploy`, not `master`.

services:
  omnigent-db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: ${DB_CONTAINER_NAME:-omnigent-db}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omnigent}
      POSTGRES_USER: ${POSTGRES_USER:-omnigent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the Portainer stack env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnigent} -d ${POSTGRES_DB:-omnigent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  omnigent:
    image: ghcr.io/korjavin/omnigent-server-vendor:d-caa84ada76a3
    container_name: ${OMNIGENT_CONTAINER_NAME:-omnigent}
    restart: unless-stopped
    depends_on:
      omnigent-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-omnigent}:${POSTGRES_PASSWORD}@omnigent-db:5432/${POSTGRES_DB:-omnigent}
      HOST: 0.0.0.0
      PORT: "8000"
      ARTIFACT_DIR: /data/artifacts
      # Anchors the server's data dir on the persistent volume: admin
      # roster (/data/admins), allowed-domains file, artifacts. Without
      # it the server falls back to /root/.omnigent inside the container
      # and loses operator config on every redeploy.
      OMNIGENT_ADMIN_CREDENTIALS_PATH: /data/admin-credentials
      # Extra built-in agents seeded at startup (show up in the web UI's
      # new-session picker like polly/debby). The bundle lives on the
      # persistent volume; agents/ in this repo is the source of truth —
      # sync it with:
      #   sudo cp -rL agents/orchestrator \
      #     /var/lib/docker/volumes/omnigent_artifact-data/_data/agents/
      OMNIGENT_BUILTIN_AGENT_DIRS: /data/agents/orchestrator

      # --- Auth ---
      # Default is oidc: omnigent runs its own login flow, which is what
      # exposes /auth/cli-login — the endpoint `omnigent login` needs to
      # register an external runner. header mode does not have it (404).
      # Everything below comes from the Portainer stack env.
      OMNIGENT_AUTH_ENABLED: "${OMNIGENT_AUTH_ENABLED:-1}"
      OMNIGENT_AUTH_PROVIDER: "${OMNIGENT_AUTH_PROVIDER:-oidc}"

      # oidc mode. The redirect URI is NOT configurable — the server
      # derives it as https://${OMNIGENT_DOMAIN}/auth/callback, so that
      # is what the IdP client must whitelist.
      OMNIGENT_OIDC_ISSUER: "${OMNIGENT_OIDC_ISSUER:-}"
      OMNIGENT_OIDC_CLIENT_ID: "${OMNIGENT_OIDC_CLIENT_ID:-}"
      OMNIGENT_OIDC_CLIENT_SECRET: "${OMNIGENT_OIDC_CLIENT_SECRET:-}"
      OMNIGENT_OIDC_COOKIE_SECRET: "${OMNIGENT_OIDC_COOKIE_SECRET:-}"
      OMNIGENT_OIDC_SCOPES: "${OMNIGENT_OIDC_SCOPES:-}"
      OMNIGENT_OIDC_ALLOWED_DOMAINS: "${OMNIGENT_OIDC_ALLOWED_DOMAINS:-}"
      OMNIGENT_OIDC_SESSION_TTL_HOURS: "${OMNIGENT_OIDC_SESSION_TTL_HOURS:-8}"
      OMNIGENT_OIDC_ALLOW_INVITES: "${OMNIGENT_OIDC_ALLOW_INVITES:-}"
      # Escape hatch for IdPs that cannot assert email_verified. Leave
      # empty: pocket-id emits the claim from a per-user flag, so the fix
      # for "email present but email_verified is not true" is to verify
      # the user in the IdP, not to stop checking here.
      OMNIGENT_OIDC_SKIP_EMAIL_VERIFICATION: "${OMNIGENT_OIDC_SKIP_EMAIL_VERIFICATION:-}"

      # header mode only (OMNIGENT_AUTH_PROVIDER=header). Must name a
      # header the forward-auth middleware lists in authResponseHeaders —
      # Traefik only del+sets those, and any other name is client-
      # spoofable. oauth2-proxy with SET_XAUTHREQUEST=true emits
      # X-Auth-Request-Email, not X-Forwarded-Email.
      OMNIGENT_AUTH_HEADER: "${OMNIGENT_AUTH_HEADER:-}"

      OMNIGENT_DOMAIN: ${OMNIGENT_HOST}
      OMNIGENT_CONFIG: ${OMNIGENT_CONFIG:-}
    volumes:
      - artifact-data:/data
    networks:
      - internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK_NAME:-traefik_default}"
      - "traefik.http.routers.omnigent.rule=Host(`${OMNIGENT_HOST}`)"
      - "traefik.http.routers.omnigent.entrypoints=websecure"
      - "traefik.http.routers.omnigent.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.omnigent.loadbalancer.server.port=8000"
      # Empty by default: in oidc mode omnigent authenticates itself, and
      # forward-auth in front of it would 401 the cookieless CLI/runner.
      # Set to "auth-errors@docker,forward-auth@docker" only for header mode.
      - "traefik.http.routers.omnigent.middlewares=${OMNIGENT_MIDDLEWARES:-}"

networks:
  internal:
    name: ${INTERNAL_NETWORK_NAME:-omnigent_internal}
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK_NAME:-traefik_default}

volumes:
  db-data:
    name: ${DB_VOLUME_NAME:-omnigent_db-data}
  artifact-data:
    name: ${ARTIFACT_VOLUME_NAME:-omnigent_artifact-data}
